openapi: 3.1.0
info:
  title: WankaEcoLogística API
  version: 0.2.0
  description: API de los Sprints 1 y 2 para autenticación, pedidos, flota, conductores y optimización de rutas.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Estado de la API
      responses:
        "200": { description: API disponible }
  /api/auth/login:
    post:
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "200": { description: Token y usuario }
        "401": { description: Credenciales inválidas }
        "423": { description: Cuenta bloqueada }
  /api/orders:
    get:
      security: [{ bearerAuth: [] }]
      summary: Listar pedidos
      responses:
        "200": { description: Lista de pedidos }
    post:
      security: [{ bearerAuth: [] }]
      summary: Registrar pedido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [
                  productName,
                  address,
                  latitude,
                  longitude,
                  weightKg,
                  windowStart,
                  windowEnd,
                ]
              properties:
                productName: { type: string, minLength: 2, maxLength: 160 }
                address: { type: string }
                latitude: { type: number }
                longitude: { type: number }
                weightKg: { type: number, exclusiveMinimum: 0 }
                windowStart: { type: string }
                windowEnd: { type: string }
      responses:
        "201": { description: Pedido registrado }
        "400": { description: Datos inválidos }
  /api/orders/{id}:
    patch:
      security: [{ bearerAuth: [] }]
      summary: Actualizar pedido
      parameters:
        [
          {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      responses:
        "200": { description: Pedido actualizado }
        "404": { description: Pedido inexistente }
  /api/vehicles:
    get:
      security: [{ bearerAuth: [] }]
      summary: Listar vehículos
      responses:
        "200": { description: Lista de vehículos }
    post:
      security: [{ bearerAuth: [] }]
      summary: Registrar vehículo (ADMIN)
      responses:
        "201": { description: Vehículo registrado }
        "409": { description: Placa duplicada }
  /api/vehicles/{id}:
    patch:
      security: [{ bearerAuth: [] }]
      summary: Actualizar vehículo o estado (ADMIN)
      parameters:
        [
          {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      responses:
        "200": { description: Vehículo actualizado }
  /api/drivers:
    get:
      security: [{ bearerAuth: [] }]
      summary: Listar conductores
      responses:
        "200": { description: Lista de conductores }
    post:
      security: [{ bearerAuth: [] }]
      summary: Registrar conductor (ADMIN)
      responses:
        "201": { description: Conductor registrado }
  /api/routes:
    get:
      security: [{ bearerAuth: [] }]
      summary: Listar rutas operativas
      responses:
        "200": { description: Lista de rutas }
    post:
      security: [{ bearerAuth: [] }]
      summary: Crear ruta manual para asignación
      responses:
        "201": { description: Ruta creada }
  /api/routes/{id}/driver:
    put:
      security: [{ bearerAuth: [] }]
      summary: Asignar o reasignar conductor
      parameters:
        [
          {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      responses:
        "200": { description: Conductor asignado }
        "409": { description: Conflicto horario o jornada mayor de ocho horas }
  /api/routes/{id}/stops:
    get:
      security: [{ bearerAuth: [] }]
      summary: Listar las paradas ordenadas de una ruta
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Paradas con coordenadas y orden de entrega }
        "404": { description: Ruta inexistente }
  /api/routes/{id}/navigation:
    get:
      security: [{ bearerAuth: [] }]
      summary: Calcular el trazado sobre la red vial para una ruta optimizada
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Geometría vial, distancia, duración, proveedor y uso de tráfico
        "409": { description: Ruta sin paradas optimizadas }
        "503": { description: Proveedor de navegación no disponible }
  /api/optimizations:
    post:
      security: [{ bearerAuth: [] }]
      summary: Optimizar hasta 50 pedidos pendientes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [routeId, vehicleId, orderIds, startsAt]
              properties:
                routeId:
                  type: string
                  format: uuid
                  description: Ruta manual planificada que se convertirá en optimizada
                vehicleId:
                  type: string
                  format: uuid
                  description: Vehículo sugerido o elegido para la ruta
                orderIds:
                  type: array
                  minItems: 1
                  maxItems: 50
                  uniqueItems: true
                  items: { type: string, format: uuid }
                startsAt:
                  type: string
                  format: date-time
                  description: Hora de salida confirmada o corregida al optimizar
      responses:
        "201":
          description: Ruta manual seleccionada optimizada desde el local de despacho y pedidos secuenciados
        "400": { description: Solicitud inválida }
        "409":
          description: Ruta, capacidad operativa del 95 %, recursos o ventanas inviables
  /api/emissions/calculate:
    post:
      security: [{ bearerAuth: [] }]
      summary: Calcular emisiones conservando valores fuente
      responses:
        "200": { description: Cálculo reproducible }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
