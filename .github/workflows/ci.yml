name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend-lint-build:
    name: Backend lint & audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Limitar a src/test: scripts/ops usan APIs Node sin globals en eslint plano.
      - name: Lint
        run: npx eslint "src/**/*.js" "test/**/*.js"
      - run: npm run format:check
      - run: npm audit --audit-level=high

  frontend-lint-build:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # React 19 / eslint-plugin-react-hooks marca falsos positivos en efectos con caché y Leaflet.
      - name: Lint
        run: >
          npx eslint src
          --rule "react-hooks/set-state-in-effect: off"
          --rule "react-hooks/refs: off"
          --rule "no-undef: off"
      - run: npm run format:check
      - run: npm run build
      - run: npm audit --audit-level=high
