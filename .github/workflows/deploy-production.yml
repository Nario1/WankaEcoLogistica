name: Deploy Production

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo del despliegue manual"
        required: false
        default: "despliegue manual Inspección 5"

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build production artifacts
    runs-on: ubuntu-latest
    outputs:
      frontend_built: ${{ steps.build_fe.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install & build frontend
        id: build_fe
        working-directory: frontend
        env:
          # Vacío = build con /api (mismo origen en Vercel). No hornear localhost.
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          npm ci
          if [ -z "$VITE_API_URL" ]; then
            echo "VITE_API_URL vacío: el cliente usará /api en producción."
            unset VITE_API_URL
          fi
          npm run build

      - name: Verify backend package
        working-directory: backend
        run: npm ci

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 30

      - name: Upload deploy notes
        uses: actions/upload-artifact@v4
        with:
          name: deploy-readme
          path: docs/03 Implementación/Guia de despliegue V_1_0_0.md
          if-no-files-found: ignore

  deploy:
    name: Publish to production hook
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.summary.outputs.prod_url }}
    steps:
      - name: Resolve deploy target
        id: summary
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          if [ -n "$PRODUCTION_URL" ]; then
            echo "prod_url=$PRODUCTION_URL" >> "$GITHUB_OUTPUT"
          else
            echo "prod_url=https://wanka-ecologistica.vercel.app" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger production deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::notice::DEPLOY_HOOK_URL aún no configurado."
            echo "El artefacto frontend-dist ya está listo."
            echo "URL por defecto: https://wanka-ecologistica.vercel.app"
            echo "Cuando tenga el Deploy Hook de Vercel, agregue el secret y re-ejecute."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL"
          echo "Hook de despliegue invocado correctamente."

      - name: Deployment summary
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          echo "### Deploy Production" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artefacto: \`frontend-dist\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PRODUCTION_URL" ]; then
            echo "- URL: $PRODUCTION_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- URL: https://wanka-ecologistica.vercel.app (default; configure \`PRODUCTION_URL\`)" >> "$GITHUB_STEP_SUMMARY"
          fi
