name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend-unit:
    name: Backend unit & integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_DB: wanka_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d wanka_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --shm-size=256mb
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wanka_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wanka_test
      DATABASE_SSL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Vitest 5 exige Node ^22.12 || ^24; unificamos backend al mismo runtime.
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:migrate
      - run: npm test

  frontend-unit:
    name: Frontend unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Vitest 5.1 engines: ^22.12.0 || ^24.0.0 || >=26 (Node 20 rompe el runner).
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:coverage

  e2e-playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [backend-unit, frontend-unit]
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_DB: wanka_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d wanka_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --shm-size=256mb
    env:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wanka_e2e
      DATABASE_SSL: "false"
      CORS_ORIGIN: http://localhost:4173
      ADMIN_EMAIL: admin@wanka.local
      ADMIN_PASSWORD: WankaAdmin2026
      PLAYWRIGHT_BASE_URL: http://localhost:4173
      PLAYWRIGHT_API_URL: http://localhost:3000
      PLAYWRIGHT_EMAIL: admin@wanka.local
      PLAYWRIGHT_PASSWORD: WankaAdmin2026
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Migrate & seed admin
        working-directory: backend
        run: |
          npm run db:migrate
          npm run db:seed
      - name: Start API
        working-directory: backend
        run: |
          npm start &
          npx --yes wait-on http://localhost:3000/health -t 60000
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build & preview frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:3000/api
        run: |
          npm run build
          npx vite preview --host localhost --port 4173 &
          npx --yes wait-on http://localhost:4173 -t 60000
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run Playwright suite
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
