sonar.projectKey=wanka-ecologistica
sonar.projectName=WankaEcoLogistica
sonar.projectVersion=0.3.1
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src,frontend/src
sonar.tests=backend/test,pruebas,frontend/src
sonar.test.inclusions=backend/test/**/*.js,pruebas/**/*.js,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx
sonar.exclusions=**/node_modules/**,**/.sonar/**,**/coverage/**,**/dist/**,**/.scannerwork/**
# Pantallas React y tema MUI: las cubre Playwright (pruebas/). En Sonar se mide
# la lógica .js del frontend (API, reglas, caché offline, formato, PWA).
sonar.coverage.exclusions=frontend/src/**/*.jsx,frontend/src/shared-theme/**,frontend/src/dashboard/**,frontend/src/features/shared/useApiResource.js,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx

sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
sonar.qualitygate.wait=true
